name: benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bench/**'
      - 'lib/Unblock/HTTP1.pm'
      - 'lib/Unblock/HTTP1/**'
      - 'HTTP1.xs'
      - 'vendor/picohttpparser/**'
      - '.github/workflows/benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: 'latest'

      - name: Install dependencies
        shell: bash
        run: |
          cpanm --notest Uniform::HTTP@0.06
          cpanm --notest --installdeps .

      - name: Build
        shell: bash
        run: |
          perl Makefile.PL
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE"

      - name: Run standalone benchmark
        shell: bash
        run: perl -Mblib bench/http1.pl 1

      - name: Run serialization diagnostic
        shell: bash
        run: perl -Mblib bench/serialize.pl 1
